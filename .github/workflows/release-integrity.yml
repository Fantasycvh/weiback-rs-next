name: Release Integrity

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Require valid Authenticode signatures and verify final installers
        required: true
        default: false
        type: boolean

jobs:
  verify-windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: tauri-app/yarn.lock
      - name: Install frontend dependencies
        run: corepack enable; yarn install --immutable
      - name: Test Rust workspace
        working-directory: .
        run: |
          $env:CARGO_BUILD_JOBS = '1'
          cargo test --workspace
      - name: Lint Rust workspace
        working-directory: .
        run: |
          $env:CARGO_BUILD_JOBS = '1'
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test collector sidecar
        working-directory: sidecar
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e .
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -t . -v
      - name: Validate frontend
        working-directory: tauri-app
        run: |
          yarn build
          yarn lint
      - name: Build collector sidecar
        working-directory: sidecar
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm weiback-collector.spec
          Copy-Item dist/weiback-collector.exe ../tauri-app/src-tauri/binaries/weiback-collector-x86_64-pc-windows-msvc.exe -Force
      - name: Build Windows installers
        run: yarn tauri build
      # The release runner must sign these final files before the next step.
      # Configure the organization-approved signing provider outside this
      # repository; unsigned tag builds intentionally fail the release gate.
      - name: Verify candidate artifacts
        working-directory: .
        run: .\scripts\verify-release.ps1 -Mode candidate -ReleaseDir .\tauri-app\src-tauri\target\release -WorkDir "$env:RUNNER_TEMP\weiback-release-integrity"
      - name: Verify signed release artifacts
        if: inputs.release_mode
        working-directory: .
        run: .\scripts\verify-release.ps1 -Mode release -ReleaseDir .\tauri-app\src-tauri\target\release -WorkDir "$env:RUNNER_TEMP\weiback-release-integrity-release"
      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-report
          path: ${{ runner.temp }}\weiback-release-integrity*\*.json
          if-no-files-found: warn
